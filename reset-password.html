<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create New Password | Haroon Ibn Rasheed Online Quran Academy</title>
<link rel="stylesheet" href="assets/style.css?v=4">
</head><body class="login-page">
<main class="login-shell" style="min-height:540px">
<section class="login-brand">
<div class="brand-pattern"></div><div class="hr-logo"><img src="assets/hr-logo.svg" alt="HR Academy Logo" style="width:100%;height:100%"></div>
<h1>Haroon Ibn Rasheed</h1><div class="brand-line"></div><div class="tagline">Online Quran Academy</div>
</section>
<section class="login-panel"><div class="login-form-wrap">
<h2>Create New Password</h2><p class="login-sub">Choose a new password for your academy account.</p>
<form onsubmit="updatePassword(event)">
<div class="field"><label for="newPassword">New Password</label><div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button class="password-toggle" type="button" onclick="togglePassword('newPassword', this)">Show</button></div></div>
<div class="field"><label for="confirmPassword">Confirm New Password</label><div class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your new password" required><button class="password-toggle" type="button" onclick="togglePassword('confirmPassword', this)">Show</button></div></div>
<button id="updatePasswordButton" class="login-btn" type="submit">Update Password</button>
<div id="updateMsg" class="login-message" role="alert" aria-live="polite"></div>
</form>
<footer class="site-footer"><strong>Haroon Ibn Rasheed Online Quran Academy</strong></footer>
</div></section></main>
<script src="assets/supabase-config.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js?v=4"></script>
</body></html>
